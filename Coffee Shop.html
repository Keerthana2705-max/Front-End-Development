<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Chill Cafe App</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#121212;
    color:#fff;
}

header{
    background:#1e1e1e;
    padding:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hidden{
    display:none;
}

.card{
    background:#222;
    border-radius:12px;
    padding:15px;
    margin:10px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

button{
    background:#d2691e;
    color:#fff;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#b85c16;
}

input,select{
    padding:10px;
    width:100%;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

.hero{
    text-align:center;
    padding:60px 20px;
    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=1600')
    center/cover;
}

.badge{
    background:red;
    border-radius:50%;
    padding:2px 8px;
}

.login-card{
    max-width:400px;
    margin:100px auto;
    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1600");
    background-size:cover;
    background-position:center;
}


#history li{
    background:#222;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="container">

<h1 style="text-align:center;">☕ Let's Chill Cafe</h1>

<div class="card login-card">

<h2>Login</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

</div>

<!-- APP -->
<div id="app" class="hidden">

<header>
<h2>
☕ Let's Chill Cafe
<span id="cartCount" class="badge">0</span>
</h2>
</header>

<div class="hero">
<h1>Welcome to Let's Chill</h1>
<p>Order your favorite snacks and coffee</p>
</div>

<div class="container">

<input
id="search"
placeholder="Search items..."
onkeyup="renderMenu()">

<h2>Menu</h2>

<div id="menu" class="grid"></div>

<h2>Cart</h2>

<div id="cart"></div>

<h3 id="total">Total: ₹0</h3>

<select id="payment">
<option>UPI</option>
<option>Card</option>
<option>Cash on Delivery</option>
</select>

<button onclick="checkout()">
Place Order
</button>

<h2>Order History</h2>

<ul id="history"></ul>

</div>

</div>

<script>

const items=[

{name:"Coffee",price:20,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500"},
{name:"Tea",price:20,image:"https://images.unsplash.com/photo-1541167760496-1628856ab772?w=500"},
{name:"Cappuccino",price:120,image:"https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500"},
{name:"Latte",price:150,image:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=500"},
{name:"Mocha",price:180,image:"https://images.unsplash.com/photo-1494314671902-399b18174975?w=500"},
{name:"Veg Puff",price:40,image:"https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500"},
{name:"Egg Puff",price:50,image:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=500"},
{name:"Paneer Roll",price:80,image:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500"},
{name:"Chicken Roll",price:120,image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"},
{name:"Veg Cutlet",price:60,image:"https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500"},
{name:"Chocolate Cake",price:150,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500"},
{name:"Black Forest Cake",price:180,image:"https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?w=500"},
{name:"Burger",price:120,image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"},
{name:"Sandwich",price:90,image:"https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500"},
{name:"French Fries",price:100,image:"https://images.unsplash.com/photo-1576107232684-1279f390859f?w=500"}

];

let cart=[];
let orders=[];

function login(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

/* Hide Hero and Open Menu Directly */
document.querySelector(".hero").style.display="none";

renderMenu();

}

function renderMenu(){

const q=document
.getElementById("search")
.value.toLowerCase();

let html="";

items
.filter(i=>i.name.toLowerCase().includes(q))
.forEach(item=>{

html+=`

<div class="card">

<img src="${item.image}" alt="${item.name}">

<h3>${item.name}</h3>

<p>₹${item.price}</p>

<button onclick="addToCart('${item.name}',${item.price})">
Add To Cart
</button>

</div>

`;

});

document.getElementById("menu").innerHTML=html;

}

function addToCart(name,price){

const f=cart.find(x=>x.name===name);

if(f){
f.qty++;
}
else{
cart.push({
name,
price,
qty:1
});
}

renderCart();

}

function renderCart(){

let html="";
let total=0;

cart.forEach((item,index)=>{

total+=item.price*item.qty;

html+=`

<div class="card">

${item.name}
- ₹${item.price}
x ${item.qty}

<button onclick="changeQty(${index},1)">
+
</button>

<button onclick="changeQty(${index},-1)">
-
</button>

</div>

`;

});

document.getElementById("cart").innerHTML=html;

document.getElementById("total").innerText=
"Total: ₹"+total;

document.getElementById("cartCount").innerText=
cart.reduce((a,b)=>a+b.qty,0);

}

function changeQty(i,v){

cart[i].qty+=v;

if(cart[i].qty<=0){
cart.splice(i,1);
}

renderCart();

}

function checkout(){

if(cart.length===0){

alert("Cart is empty");

return;

}

const id=
"ORD"+
Math.floor(Math.random()*100000);

orders.push(id);

const li=
document.createElement("li");

li.textContent=
id+
" - Paid via "+
document.getElementById("payment").value;

document
.getElementById("history")
.appendChild(li);

cart=[];

renderCart();

alert(
"Order placed successfully!\nOrder ID: "
+id
);

}

</script>

</body>
</html>
